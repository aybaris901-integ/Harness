[project]
name = "harness-bot"
version = "0.1.0"
description = "Family Telegram bot: agent harness over free-tier LLMs"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
harness-bot = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
